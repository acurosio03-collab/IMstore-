<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMSTORE Asset Check</title>
<style>
body{font-family:system-ui;margin:30px;background:#f4f2ed;color:#111}main{max-width:760px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}
.ok{color:#087e79;font-weight:700}.bad{color:#b42318;font-weight:700}
img{max-width:180px;border-radius:10px}video{max-width:280px;max-height:300px;border-radius:10px;background:#111}
code{background:#eee;padding:2px 5px;border-radius:5px}
</style></head>
<body><main>
<h1>IMSTORE — Asset Check</h1>
<p>Halaman ini untuk mengecek apakah Vercel sudah mengirim folder <code>/assets</code>.</p>
<div id="list"></div>
<p><a href="/">← Kembali ke website</a></p>
<script>
const files=[
 ["Foto ThinkPad","assets/thinkpad-front.jpg","img"],
 ["Foto ThinkPad angle","assets/thinkpad-angle.jpg","img"],
 ["Foto MacBook","assets/macbook-air.jpg","img"],
 ["Video 1","assets/video-1.mp4","video"],
 ["Video 2","assets/video-2.mp4","video"],
 ["Video 3","assets/video-3.mp4","video"]
];
const root=document.querySelector("#list");
for(const [name,src,type] of files){
 const box=document.createElement("div"); box.className="card";
 const title=document.createElement("div"); title.innerHTML="<strong>"+name+"</strong> — <span>loading...</span>";
 box.appendChild(title);
 let el=document.createElement(type);
 el.src=src;
 if(type==="video"){el.controls=true;el.preload="metadata";el.style.maxWidth="280px"}
 else {el.loading="lazy"}
 el.onload=()=>title.querySelector("span").outerHTML='<span class="ok">OK</span>';
 el.onloadedmetadata=()=>title.querySelector("span").outerHTML='<span class="ok">OK</span>';
 el.onerror=()=>title.querySelector("span").outerHTML='<span class="bad">GAGAL — file tidak ditemukan</span>';
 box.appendChild(el); root.appendChild(box);
}
</script></main></body></html>
